# Render Blueprint - backend (FastAPI) deploy.
# Secret values are configured in the Render dashboard and never committed.
services:
  - type: web
    name: ai-stock-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-deploy.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"

      # Market and AI provider credentials. Render ignores sync:false entries
      # on existing Blueprint updates, so current dashboard values are retained.
      - key: FINMIND_API_KEY
        sync: false
      - key: FINMIND_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false

      - key: TW_AI_MODEL
        value: "anthropic:claude-sonnet-4-6"
      - key: TW_AI_MODEL_UNIFIED
        value: "anthropic:claude-haiku-4-5-20251001"
      - key: CORS_ORIGINS
        value: "https://ai-stock-rosy-eight.vercel.app"

      # These routes stay closed until their secrets are configured manually.
      - key: TELEGRAM_ADMIN_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
