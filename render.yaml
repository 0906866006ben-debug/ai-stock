# Render Blueprint — backend (FastAPI) deploy.
# In Render: New > Blueprint > pick this repo. It reads this file automatically.
#
# The app import path is `backend.app.main:app` and MUST run from the repo root
# so the `backend.app...` package resolves (see CLAUDE.md).
services:
  - type: web
    name: ai-stock-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-deploy.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin 3.13 (guaranteed wheels for numpy/pandas). Bump to 3.14 if you prefer.
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Live-data keys — committed at the repo owner's explicit request
      # (repo is PRIVATE). Gemini removed; all AI runs on Claude below.
      - key: FINMIND_API_KEY
        value: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoiQmVtQ2hhbmciLCJlbWFpbCI6IjA5MDY4NjYwMDZiZW5AZ21haWwuY29tIiwidG9rZW5fdmVyc2lvbiI6MH0.Oz354poBWHKPxDfIAjahF7fWvqQUj4jE6cWSJebpeFQ"
      - key: FINMIND_TOKEN
        value: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoiQmVtQ2hhbmciLCJlbWFpbCI6IjA5MDY4NjYwMDZiZW5AZ21haWwuY29tIiwidG9rZW5fdmVyc2lvbiI6MH0.Oz354poBWHKPxDfIAjahF7fWvqQUj4jE6cWSJebpeFQ"
      # Route all TW analysis agents through the user's paid Claude key
      # (no Gemini free-tier 429; full multi-pillar analysis). Repo is private.
