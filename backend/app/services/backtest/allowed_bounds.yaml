# Allowed parameter bounds + whitelists + core invariants for the Claude-driven optimizer.
#
# Core invariants define the *immutable strategy identity*:
#   1) 90-day high/low range must be in [10%, 30%] (主力表態 then consolidation)
#   2) EMA(5/10/20) micro-upturn from prior down-bias must be detected
#   3) Volume must contract during consolidation
#
# Claude API may TUNE strictness within these bounds but must NEVER remove the gates.
# Bounds below are deliberately tighter than allowed_bounds in user spec for
# the parameters that enforce core_invariants.

core_invariants:
  description: |
    These parameter ranges are non-negotiable. They lock in the strategy's identity:
    - "近3個月擺盪 10%~30%"
    - "縮量盤整 (base 後半量能 < 前半 100%)"
    - "EMA 由下彎轉為微上翹"
  constraints:
    # 90d range: 10-30% is the core strategy thesis — bounds stay close
    pre_breakout_range_90d_min:
      hard_min: 0.05    # cannot loosen below 5%
      hard_max: 0.15    # cannot tighten above 15%
    pre_breakout_range_90d_max:
      hard_min: 0.20    # cannot tighten below 20%
      hard_max: 0.40    # cannot loosen above 40%
    # Volume contraction: must remain <= 1.0 (i.e., must require contraction)
    pre_breakout_volume_contraction_max:
      hard_min: 0.60
      hard_max: 1.00    # at most "second half ≤ first half" — never allow expansion
    # EMA transition score: cannot drop below 30 (must detect transition)
    pre_breakout_ema_transition_score_min:
      hard_min: 30
      hard_max: 70
    # EMA spread: must remain tight enough to be 糾結 (≤ 8%)
    pre_breakout_ema_spread_max:
      hard_min: 0.02
      hard_max: 0.08
    # EMA micro-upturn score: cannot drop below 30
    pre_breakout_ema_score_min:
      hard_min: 30
      hard_max: 70

# User-friendly parameter names → rules_v1.yaml dotted paths.
# Claude uses the short names; we translate to dotted paths internally.
parameter_mapping:
  min_return_60d: price_position.min_return_60d
  pre_breakout_return_90d_min: price_position.pre_breakout_return_90d_min
  pre_breakout_return_90d_max: price_position.pre_breakout_return_90d_max_strict
  pre_breakout_range_90d_min: price_position.pre_breakout_range_90d_min
  pre_breakout_range_90d_max: price_position.pre_breakout_range_90d_max
  max_return_20d_for_pre_breakout: price_position.pre_breakout_return_20d_strict_max
  max_return_60d_for_pre_breakout: price_position.pre_breakout_return_60d_strict_max
  max_close_from_ema20_pct: ema.pre_breakout_close_ema20_max
  max_ema_spread: ema.pre_breakout_ema_spread_max
  max_volume_contraction_ratio: volume.pre_breakout_volume_contraction_max
  min_pre_breakout_score: classification.pre_breakout_score_min
  min_base_compression_score: classification.pre_breakout_base_score_min
  min_ema_micro_upturn_score: classification.pre_breakout_ema_score_min
  min_ema_down_to_up_transition_score: classification.pre_breakout_ema_transition_score_min
  max_close_to_base_high_ratio: classification.pre_breakout_close_to_base_high_max
  max_risk_score: classification.pre_breakout_risk_score_max
  min_avg_volume_20_lots: liquidity.min_avg_volume_20_lots
  min_avg_turnover_20: liquidity.min_avg_turnover_20
  high_turnover_bonus_threshold: classification.pre_breakout_min_turnover
  # Phase 9.8 — Flat Base event trigger
  breakout_pivot_buffer: classification.breakout_pivot_buffer
  breakout_volume_ratio_min: classification.breakout_volume_ratio_min
  base_depth_max: classification.base_depth_max
  # Phase 9.8 — Exit rules
  max_hold_days: trade_rules.max_hold_days
  stop_loss_pct: trade_rules.stop_loss_pct
  measured_move_multiplier: trade_rules.measured_move_multiplier

# Allowed bounds for each whitelisted parameter (Claude cannot propose outside these).
# Subject to core_invariants taking precedence where applicable.
allowed_bounds:
  min_return_60d: [-0.30, 0.05]
  pre_breakout_return_90d_min: [-0.30, 0.05]
  pre_breakout_return_90d_max: [0.15, 0.50]
  pre_breakout_range_90d_min: [0.05, 0.15]      # core invariant tightens this
  pre_breakout_range_90d_max: [0.20, 0.40]      # core invariant tightens this
  max_return_20d_for_pre_breakout: [0.05, 0.20]
  max_return_60d_for_pre_breakout: [0.05, 0.25]
  max_close_from_ema20_pct: [0.04, 0.15]
  max_ema_spread: [0.02, 0.08]                  # core invariant: cannot exceed 0.08
  max_volume_contraction_ratio: [0.60, 1.00]    # core invariant: cannot exceed 1.00
  min_pre_breakout_score: [40, 75]
  min_base_compression_score: [30, 80]
  min_ema_micro_upturn_score: [30, 70]          # core invariant
  min_ema_down_to_up_transition_score: [30, 70] # core invariant
  max_close_to_base_high_ratio: [0.95, 1.10]
  max_risk_score: [50, 80]
  min_avg_volume_20_lots: [100, 1000]
  min_avg_turnover_20: [10000000, 150000000]
  high_turnover_bonus_threshold: [30000000, 300000000]
  # Phase 9.8 — Flat Base event trigger bounds
  breakout_pivot_buffer: [0.0005, 0.01]       # 0.05% ~ 1% breakout (typical 0.1-0.5%)
  breakout_volume_ratio_min: [1.0, 3.0]       # 量爆 1× ~ 3× (O'Neil 標準 1.4)
  base_depth_max: [0.06, 0.25]                # base 深度 6%~25% (O'Neil flat ≤15%)
  # Phase 9.8 — Exit rules bounds
  max_hold_days: [0, 250]                     # 0 = unlimited, 250 trading days ≈ 1 year cap
  stop_loss_pct: [0.04, 0.15]                 # -4% ~ -15% (O'Neil 7-8%, user 10%)
  measured_move_multiplier: [0.50, 1.50]      # 0.5× ~ 1.5× pole height

# Weight whitelist (under scoring.pre_breakout_weights.*)
weight_whitelist:
  - base_compression_score
  - volume_contraction_score
  - ema_micro_upturn_score
  - ema_down_to_up_transition_score
  - setup_price_position_score
  - relative_strength_score
  - liquidity_score
  - risk_score   # must be <= 0

weight_bounds:
  base_compression_score: [0.05, 0.40]
  volume_contraction_score: [0.05, 0.40]
  ema_micro_upturn_score: [0.05, 0.40]
  ema_down_to_up_transition_score: [0.05, 0.40]
  setup_price_position_score: [0.05, 0.30]
  relative_strength_score: [0.00, 0.20]
  liquidity_score: [0.00, 0.20]
  risk_score: [-0.30, 0.00]   # must be non-positive
