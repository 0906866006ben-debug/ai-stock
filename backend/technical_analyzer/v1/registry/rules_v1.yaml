    turnover_estimated_cap: 75
    insufficient_history_cap: 50
    universe_size_estimated_penalty: 5
  classification:
    disqualify_score_below: 55
    observation_score_min: 60
    initial_score_min: 65
    momentum_score_min: 70
    initial_return_60d_min: 0.10
    initial_return_60d_max: 0.20
    momentum_return_60d_min: 0.15
    momentum_return_60d_max: 0.25
    overheat_return_60d: 0.30
    overheat_risk_score: 70
    observation_risk_score_max: 65
    observation_positive_signs_min: 2
    pre_breakout_score_min: 55    # 路線 B 鬆綁: 60 → 55，包含邊緣訊號拉高樣本
    pre_breakout_risk_score_max: 65
    pre_breakout_base_score_min: 50
    pre_breakout_ema_score_min: 50
    pre_breakout_ema_transition_score_min: 20    # Phase 9.8: 從 50 降到 20 — breakout_today + ema_micro_upturn 已覆蓋「EMA 轉強」核心,transition gate 改為弱過濾
    # 鬆綁版 (路線 B): 100M → 50M, 包含中型熱門股拉高樣本
    pre_breakout_min_turnover: 50_000_000
    pre_breakout_close_to_base_high_min: 0.85    # 允許在整理區中段以上 (0.85~1.00)
    pre_breakout_close_to_base_high_ideal_max: 1.00
    pre_breakout_close_to_base_high_max: 1.05    # O'Neil buy zone: 突破後 ≤5% 才不算 extended (Phase 9.8 從 1.00 放寬)
    pre_breakout_close_from_base_low_max: 0.30
    initial_base_score_min: 50
    initial_ema_score_min: 55
    initial_volume_score_min: 50
    initial_risk_score_max: 60
    # Flat Base (O'Neil) event-trigger entry rules — added by Phase 9.8
    breakout_pivot_buffer: 0.001        # close > base_high × (1 + 0.001) = 突破 0.1%
    breakout_volume_ratio_min: 1.4      # 突破日量 ≥ 50 日均量 × 1.4 (O'Neil 標準)
    base_depth_max: 0.15                # base 高低差 ≤ 15% (O'Neil flat base)
  api:
    default_scan_limit: 1000
    max_scan_limit: 10000
    default_limit: 30
    max_limit: 200
    default_market: "TW"
    default_sort_by: "surge_candidate_score"
