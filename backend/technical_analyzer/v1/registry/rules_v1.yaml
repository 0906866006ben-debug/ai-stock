      base_compression_score: 0.20            # 縮量盤整 (基底振幅 + base_return + 量縮)
      volume_contraction_score: 0.20          # 純 volume_contraction_ratio 分數
      ema_micro_upturn_score: 0.20            # EMA 現在斜率方向 (從 0.30 降至 0.20)
      ema_down_to_up_transition_score: 0.20   # EMA 由弱轉強 — 前期下彎 → 近期上翹 (新增)
      setup_price_position_score: 0.10        # 價格位置(靠近 EMA20 / 基底高點)
      relative_strength_score: 0.05
      liquidity_score: 0.05
      risk_score: -0.10
    score_min: 0
    score_max: 100
